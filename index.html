<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>Duck Stomp</title>
    <!-- Inline so there is no second request, and no 404 when there is no file. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%23131735'/%3E%3Crect x='2' y='1' width='4' height='6' fill='%23F2B33D'/%3E%3Crect x='3' y='2' width='1' height='4' fill='%23131735'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Pixelify+Sans:wght@400..700&display=swap"
    />
    <style>
      /* Tokens: docs/design-system/platformer/MASTER.md. Letterbox is --night-deep,
         which is also the page background, so the canvas edge is invisible. */
      :root {
        --night-deep: #131735;
        --night: #262e5e;
        --panel: #2e376b;
        --ink: #f2ecdf;
        --ink-dim: #aeb4da;
        --gold: #f2b33d;
        --locked: #7b84ba;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--night-deep);
        color: var(--ink);
        font-family: 'Pixelify Sans', ui-monospace, monospace;
        overflow: hidden;
        /* The game owns every gesture inside the canvas: no double-tap zoom, no
           pull-to-refresh eating an upward swipe, no text selection on a long press. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        display: grid;
        place-items: center;
        height: 100%;
      }
      #app canvas {
        display: block;
        /* Belt and braces for invariants #1: even if a browser tries to smooth the
           upscale, say no. The integer zoom itself is computed in core/scale.ts. */
        image-rendering: pixelated;
      }

      /* Rotate gate (FR-16). Hidden by default; rotateGate.ts toggles [hidden].
         No text anywhere in it — nothing to translate (ADR-0005). */
      #rotate-gate {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: var(--night-deep);
      }
      #rotate-gate[hidden] {
        display: none;
      }
      .rotate-row {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .rotate-phone {
        background: var(--night-deep);
        border: 4px solid var(--ink-dim);
        width: 72px;
        height: 128px;
        opacity: 0.55;
      }
      .rotate-phone--goal {
        border-color: var(--gold);
        width: 128px;
        height: 72px;
        opacity: 1;
      }
      .rotate-arrow {
        color: var(--gold);
      }
      /* The one animation outside the canvas, and it is essential rather than
         decorative: it is what says "turn it" without a word. */
      @media (prefers-reduced-motion: no-preference) {
        .rotate-phone--goal {
          animation: nudge 1.6s steps(2, end) infinite;
        }
      }
      @keyframes nudge {
        0%,
        60%,
        100% {
          transform: none;
        }
        30% {
          transform: translateX(6px);
        }
      }

      /* Ducker ID account control (ADR-0013). Plain DOM like the rotate gate, and for
         the same reason: the user's own name can carry Vietnamese diacritics that the
         pixel fonts cannot draw. Pixel look per MASTER.md: square corners, 2px border,
         hard 4px offset shadow, instant state changes (no transitions). Gold is kept
         for focus. accountOverlay.ts places it clear of the in-canvas sound button. */
      #account-overlay {
        position: fixed;
        z-index: 5; /* under #rotate-gate (10) */
        top: 8px;
        right: 68px;
        font-family: 'Pixelify Sans', ui-monospace, monospace;
        touch-action: manipulation;
      }
      #account-overlay[hidden] {
        display: none;
      }
      .acct-btn,
      .acct-item {
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 44px;
        min-height: 44px;
        padding: 0 12px;
        font: 400 14px/1 'Pixelify Sans', ui-monospace, monospace;
        letter-spacing: 0.04em;
        color: var(--ink);
        background: var(--night);
        border: 2px solid var(--ink-dim);
        border-radius: 0;
        box-shadow: 4px 4px 0 var(--night-deep);
        cursor: pointer;
        text-decoration: none;
      }
      .acct-btn:hover:not(:disabled),
      .acct-item:hover {
        background: var(--panel);
        border-color: var(--ink);
      }
      .acct-btn:active:not(:disabled),
      .acct-item:active {
        box-shadow: none;
        transform: translate(4px, 4px);
      }
      .acct-btn:focus-visible,
      .acct-item:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      .acct-btn:disabled {
        color: var(--ink-dim);
        border-color: var(--locked);
        box-shadow: none;
        cursor: default;
      }
      .acct-btn--avatar {
        padding: 0 8px;
      }
      .acct-avatar {
        box-sizing: border-box;
        width: 28px;
        height: 28px;
        border: 2px solid var(--ink-dim);
        border-radius: 0;
        background: var(--panel);
        object-fit: cover;
      }
      .acct-avatar--initial {
        display: grid;
        place-items: center;
        font: 400 14px/1 system-ui, sans-serif;
        color: var(--ink);
      }
      .acct-menu {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 240px;
        max-width: calc(100vw - 16px);
        padding: 12px;
        background: var(--panel);
        border: 2px solid var(--night-deep);
        border-radius: 0;
        box-shadow: 4px 4px 0 var(--night-deep);
      }
      .acct-menu[hidden] {
        display: none;
      }
      /* The player's own text: system font, so Vietnamese diacritics render. */
      .acct-name,
      .acct-email {
        margin: 0;
        font-family: system-ui, sans-serif;
        overflow-wrap: anywhere;
        -webkit-user-select: text;
        user-select: text;
      }
      .acct-name {
        font-size: 16px;
        font-weight: 600;
        color: var(--ink);
      }
      .acct-email {
        font-size: 14px;
        color: var(--ink-dim);
      }
      .acct-item {
        justify-content: flex-start;
        box-shadow: none;
        background: transparent;
      }
      .acct-item:active {
        transform: none;
        background: var(--night);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="account-overlay" hidden></div>

    <div id="rotate-gate" hidden>
      <div class="rotate-row">
        <div class="rotate-phone"></div>
        <svg class="rotate-arrow" width="56" height="40" viewBox="0 0 14 10" shape-rendering="crispEdges" aria-hidden="true">
          <g fill="currentColor">
            <rect x="1" y="4" width="12" height="2" />
            <rect x="9" y="2" width="2" height="2" />
            <rect x="11" y="3" width="2" height="2" />
            <rect x="9" y="6" width="2" height="2" />
            <rect x="11" y="5" width="2" height="2" />
          </g>
        </svg>
        <div class="rotate-phone rotate-phone--goal"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
