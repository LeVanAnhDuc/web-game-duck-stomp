name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Đẩy tiếp lên cùng một branch thì lần chạy trước không còn ý nghĩa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Tách ba job có chủ ý: chúng chạy song song, và "bất biến bị phá", "test đỏ",
  # "bundle phình" là ba tin khác nhau, không nên xếp hàng chờ nhau.
  verify:
    name: Boundary, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Core purity boundary
        # Bất biến #2 và #5: src/core/ không được import phaser, không được đọc
        # đồng hồ, không được gọi Math.random. Không type checker nào bắt ba thứ
        # này, nên đây là chỗ DUY NHẤT chúng được kiểm tự động.
        run: npm run lint:core

      - name: Levels are reproducible from their ASCII maps
        # Nếu ai sửa tay file JSON của màn chơi thay vì sửa bản đồ ASCII rồi sinh
        # lại, git diff ở đây sẽ đỏ. Cùng lúc đó, hai assertion trong script
        # (vực không rộng hơn tầm nhảy, mọi thứ phải đứng trên đất) được chạy lại.
        run: |
          npm run levels
          git diff --exit-code -- assets/levels/ || {
            echo "::error::assets/levels/ khác với output của scripts/make-level.mjs. Sửa bản đồ ASCII rồi chạy 'npm run levels', đừng sửa tay JSON."
            exit 1
          }

      - name: Typecheck and unit tests
        run: npm run build && npm test

  # NFR-SEC-05, đọc từ advisory database của GitHub. Chỉ chạy được trên pull
  # request: action này so cây phụ thuộc của base với head, nên nó cần hai đầu.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  e2e:
    name: Build, budget, end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Script payload budget
        # NFR-PERF-08, đo từ dist/ đã build chứ không đọc bảng Vite in ra: thứ
        # trình duyệt tải về là các file, không phải bảng.
        run: node scripts/check-bundle-size.mjs dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Ba khổ ngang: 667×375 · 1024×768 · 1440×900. Không có E2E cho physics —
      # xem lý do ở docs/specs/core-game/design.md §9.
      - name: End-to-end smoke tests
        run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
