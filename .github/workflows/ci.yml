name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Đẩy tiếp lên cùng một branch thì lần chạy trước không còn ý nghĩa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The game app lives in client/; every `run:` step works from there.
defaults:
  run:
    working-directory: client

jobs:
  # Tách ba job có chủ ý: chúng chạy song song, và "bất biến bị phá", "test đỏ",
  # "bundle phình" là ba tin khác nhau, không nên xếp hàng chờ nhau.
  verify:
    name: Boundary, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # No package.json at the root: the app lives in client/.
          package_json_file: client/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Core purity boundary
        # Bất biến #2 và #5: src/core/ không được import phaser, không được đọc
        # đồng hồ, không được gọi Math.random. Không type checker nào bắt ba thứ
        # này, nên đây là chỗ DUY NHẤT chúng được kiểm tự động.
        run: pnpm lint:core

      - name: Levels are reproducible from their ASCII maps
        # Nếu ai sửa tay file JSON của màn chơi thay vì sửa bản đồ ASCII rồi sinh
        # lại, git diff ở đây sẽ đỏ. Cùng lúc đó, hai assertion trong script
        # (vực không rộng hơn tầm nhảy, mọi thứ phải đứng trên đất) được chạy lại.
        run: |
          pnpm levels
          git diff --exit-code -- assets/levels/ || {
            echo "::error::client/assets/levels/ khác với output của scripts/make-level.mjs. Sửa bản đồ ASCII rồi chạy 'pnpm levels', đừng sửa tay JSON."
            exit 1
          }

      - name: Typecheck and unit tests
        run: pnpm build && pnpm test

  # NFR-SEC-05, đọc từ advisory database của GitHub. Chỉ chạy được trên pull
  # request: action này so cây phụ thuộc của base với head, nên nó cần hai đầu.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  e2e:
    name: Build, budget, regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # No package.json at the root: the app lives in client/.
          package_json_file: client/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            client/pnpm-lock.yaml
            automation-testing/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Script payload budget
        # NFR-PERF-08, đo từ dist/ đã build chứ không đọc bảng Vite in ra: thứ
        # trình duyệt tải về là các file, không phải bảng.
        run: node scripts/check-bundle-size.mjs dist

      # Bộ hồi quy là package riêng (automation-testing/). webServer của nó tự bật
      # Vite dev server của client/ (:4173 cờ Ducker ID tắt, :4174 cờ bật với
      # issuer giả) — bản dev vì chỉ nó có window.duckstomp để nhìn vào canvas;
      # bản production đã được bước Build ở trên che. Không có E2E cho physics —
      # xem lý do ở docs/specs/core-game/design.md §9.
      - name: Install the regression suite
        working-directory: automation-testing
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: automation-testing
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck, unit, traceability
        working-directory: automation-testing
        run: pnpm typecheck && pnpm test:unit && pnpm coverage:check

      - name: Regression suite
        working-directory: automation-testing
        run: pnpm test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: automation-testing/playwright-report/
          retention-days: 7
